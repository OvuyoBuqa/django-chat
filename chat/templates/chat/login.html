{% extends "chat/base.html" %}
{% load static %}

{% block title %}Login — Chatter{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Welcome back</h1>
        <p>Sign in to continue chatting.</p>
    </div>

    <div class="card" style="max-width: 400px; margin: 0 auto;">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Your username" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Your password" required>
            </div>
            {% if error %}
                <p style="color: var(--danger); font-size: 0.875rem; margin-bottom: 12px;">{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
